services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: raileta
      MYSQL_USER: rail
      MYSQL_PASSWORD: rail
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./app/backend
    environment:
      DATABASE_URL: mysql+mysqlconnector://rail:rail@mysql:3306/raileta
      RAILRADAR_API_KEY: ${RAILRADAR_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./app/frontend
    environment:
      VITE_API_URL: http://localhost:8001
    depends_on:
      - backend
    ports:
      - "5174:5173"

volumes:
  mysql_data:
